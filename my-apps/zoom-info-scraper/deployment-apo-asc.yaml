apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoom-info-scraper-apo-comp-asc
  namespace: zoom-info
  labels:
    app: zoom-info-scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zoom-info-scraper-apo-comp-asc
  template:
    metadata:
      labels:
        app: zoom-info-scraper-apo-comp-asc
    spec:
      containers:
        - name: zoom-info-scraper-apo-comp-asc
          image: ghcr.io/sandesh-solabannavar/zoominfo-scraper:0186457
          imagePullPolicy: IfNotPresent # Important for using remote images
          ports:
            - containerPort: 3000
          env:
            - name: METHOD
              value: processApollo
            - name: BATCH_SIZE
              value: "100"
            - name: ORDER
              value: asc
          envFrom:
            - secretRef:
                name: zoom-info-scraper-secrets
      imagePullSecrets:
        - name: ghcr-login-secret
